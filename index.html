<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0"
        >
        
        <title>LA Street Names</title>
        
        <link
            href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
            rel="stylesheet"
        >

        <style>
            html, 
            body {
                margin: 0;
                padding: 0;
                height: 100%;
            }

            #map {
                width: 100%;
                height: 100%;
            }
        </style>

    </head>

    
    <!--Way 1: display using MapTiler API-->
    <body>
        <div id="map"></div>
        <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
    
        <script>
            const map = new maplibregl.Map({
                container: 'map',
                style: 'https://api.maptiler.com/maps/streets-v4/style.json?key=SNpuwN4LdwNozQ2BLN6N',
                center: [-118.2437, 34.0522],
                zoom: 10
            });
        </script>
